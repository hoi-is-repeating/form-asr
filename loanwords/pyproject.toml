[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loanword-eval"
version = "1.0.0"
description = "Recognition and written form of Korean loanwords in end-to-end speech recognition"
requires-python = ">=3.10"
dependencies = [
  "jiwer==4.0.0",
  "rapidfuzz>=3.14",
  "transformers==5.17.0",
  "datasets==5.0.1",
  "numpy>=2.0",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "pyyaml>=6.0",
  "soundfile>=0.12",
  "kiwipiepy==0.23.2",
  "wordfreq[cjk]==3.1.1",
  "jamo>=0.4",
]

[project.optional-dependencies]
gpu = ["torch==2.14.0", "accelerate>=1.0", "librosa==1.0.0", "mistral-common[audio]==1.12.0"]
dev = ["pytest>=8", "sentencepiece==0.2.1"]

[tool.setuptools.packages.find]
include = ["loanword_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E731", "E741"]
