[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-eval"
version = "1.0.0"
description = "Recognition, written form and conversion to LaTeX of spoken mathematics in end-to-end speech recognition"
requires-python = ">=3.10"
dependencies = [
  "loanword-eval",
  "jiwer==4.0.0",
  "rapidfuzz>=3.14",
  "transformers==5.17.0",
  "datasets==5.0.1",
  "numpy>=2.0",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "pyyaml>=6.0",
  "soundfile>=0.12",
  "librosa==1.0.0",
  "wordfreq==3.1.1",
  "spacy>=3.8",
  "g2p_en==2.1.0",
  "process_formula==0.0.4",
]

[project.optional-dependencies]
gpu = ["torch==2.14.0", "accelerate>=1.0", "peft>=0.21"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["math_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E731", "E741"]
